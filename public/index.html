<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gia sư Tiếng Anh 7 - Global Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, Helvetica, sans-serif; }
        body { background: #f0fdf4; display: flex; justify-content: center; height: 100dvh; padding: 10px; }
        .app-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(22, 163, 74, 0.1); overflow: hidden; }
        
        .header { background: #16a34a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header h2 { font-size: 18px; }
        
        .toolbar { padding: 10px 15px; background: #dcfce7; border-bottom: 1px solid #bbf7d0; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        select { padding: 8px; border-radius: 8px; border: 1px solid #16a34a; flex: 1; outline: none; font-weight: bold; color: #16a34a; font-size: 13px; }
        
        .skills-bar { display: flex; gap: 6px; padding: 10px 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; overflow-x: auto; flex-shrink: 0; white-space: nowrap; }
        .skill-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #cbd5e1; background: white; color: #475569; font-size: 12.5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .skill-btn:hover, .skill-btn.active { background: #f97316; color: white; border-color: #f97316; }

        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #f8fafc; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 88%; }
        .tutor-wrapper { align-self: flex-start; }
        .student-wrapper { align-self: flex-end; }
        
        .msg { padding: 12px 16px; border-radius: 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
        .tutor { background: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .student { background: #f97316; color: white; border-bottom-right-radius: 2px; }

        /* Khối hiển thị song ngữ */
        .en-text { font-weight: 500; }
        .vn-text { font-size: 13.5px; color: #475569; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #cbd5e1; font-style: italic; }

        .input-bar { padding: 10px 14px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        textarea { flex: 1; height: 44px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 20px; padding: 11px 16px; outline: none; resize: none; font-size: 14px; }
        
        button.action-btn { padding: 0 16px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; height: 44px; transition: 0.2s; color: white; }
        .btn-mic { background: #ef4444; padding: 0 14px; font-size: 18px; }
        .btn-send { background: #16a34a; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal-card { background: white; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
        .modal-card input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none;}
        .modal-card button { background: #f97316; color: white; width: 100%; margin-top: 10px; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; border: none;}
    </style>
</head>
<body>

<div class="modal" id="startModal">
    <div class="modal-card">
        <h2 style="color: #16a34a;">👋 Chào mừng em đến lớp!</h2>
        <p style="color: #64748b; font-size: 14px; margin-top: 5px;">Thầy cô AI sẽ đồng hành cùng em học Tiếng Anh 7</p>
        <input type="text" id="studentName" placeholder="Tên của em là gì? (Ví dụ: Minh, Lan)">
        
        <div style="text-align: left; margin-bottom: 15px;">
            <label style="font-size: 13px; font-weight: bold; color: #333;">Chọn giáo viên (Giọng chuẩn Anh/Mỹ):</label>
            <select id="voiceSelect" style="width: 100%; margin-top: 5px; border: 1px solid #ccc; color: #333; outline: none; padding: 8px; border-radius: 6px;"></select>
        </div>

        <button onclick="startClass()">Vào lớp học 🚀</button>
    </div>
</div>

<div class="app-container">
    <div class="header">
        <h2>📚 Tiếng Anh 7 Tutor</h2>
        <span style="font-size: 13px; font-weight: bold;">Học sinh: <span id="displayStudentName"></span></span>
    </div>
    
    <div class="toolbar">
        <select id="unitSelect" onchange="changeUnit()">
            <option value="Unit 1: Hobbies">Unit 1: Hobbies</option>
            <option value="Unit 2: Healthy Living">Unit 2: Healthy Living</option>
            <option value="Unit 3: Community Service">Unit 3: Community Service</option>
            <option value="Unit 4: Music and Arts">Unit 4: Music and Arts</option>
            <option value="Unit 5: Food and Drink">Unit 5: Food and Drink</option>
            <option value="Unit 6: A Visit to a School">Unit 6: A Visit to a School</option>
            <option value="Unit 7: Traffic">Unit 7: Traffic</option>
            <option value="Unit 8: Films">Unit 8: Films</option>
            <option value="Unit 9: Festivals around the World">Unit 9: Festivals</option>
            <option value="Unit 10: Energy Sources">Unit 10: Energy Sources</option>
            <option value="Unit 11: Travelling in the Future">Unit 11: Travelling in the Future</option>
            <option value="Unit 12: English-Speaking Countries">Unit 12: English-Speaking Countries</option>
        </select>
    </div>

    <div class="skills-bar">
        <button class="skill-btn active" onclick="setSkill(this, 'Giao tiếp chung')">Giao tiếp 🗣️</button>
        <button class="skill-btn" onclick="setSkill(this, 'Từ vựng')">Từ vựng 📖</button>
        <button class="skill-btn" onclick="setSkill(this, 'Ngữ pháp')">Ngữ pháp 💡</button>
        <button class="skill-btn" onclick="setSkill(this, 'Luyện đọc')">Luyện đọc 📚</button>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-bar">
        <textarea id="userInput" placeholder="Nhắn tin cho thầy/cô hoặc bấm Micro..."></textarea>
        <button class="action-btn btn-mic" id="micBtn" onclick="toggleMic()">🎤</button>
        <button class="action-btn btn-send" id="sendBtn" onclick="sendAnswer()">Gửi</button>
    </div>
</div>

<script>
    let history = [];
    let studentName = '';
    let recognition;
    let availableVoices = [];
    let isProcessing = false;
    let currentSkill = 'Giao tiếp chung';

    function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        const all = window.speechSynthesis.getVoices();
        const enVoices = all.filter(v => (v.lang || '').toLowerCase().includes('en-gb') || (v.lang || '').toLowerCase().includes('en-us'));
        
        const cleanVoices = enVoices.filter(v => {
            const bad = ['whisper', 'zarvox', 'trinoids', 'boing', 'bells', 'deranged'];
            return !bad.some(b => v.name.toLowerCase().includes(b));
        }).slice(0, 10);

        const sel = document.getElementById('voiceSelect');
        sel.innerHTML = '';
        cleanVoices.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.name;
            const flag = v.lang.includes('gb') ? '🇬🇧 UK' : '🇺🇸 US';
            opt.textContent = `${flag} - ${v.name.replace(/Google|Microsoft/gi, '').trim()}`;
            sel.appendChild(opt);
        });
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
    }

    function unlockAudio() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.resume();
            const silent = new SpeechSynthesisUtterance('');
            silent.volume = 0;
            window.speechSynthesis.speak(silent);
        }
    }

    // BỘ LỌC ÂM THANH SẠCH: Loại bỏ emoji và dấu chấm than/chấm hỏi thừa
    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        
        // Loại bỏ emoji và các ký tự đặc biệt (*, ", _)
        let cleanText = text.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');
        cleanText = cleanText.replace(/[*"“”_]/g, '');
        // Biến ... thành một dấu chấm để tránh máy đọc "chấm chấm chấm"
        cleanText = cleanText.replace(/\.\.\./g, '.');

        const utt = new SpeechSynthesisUtterance(cleanText);
        const sel = availableVoices.find(v => v.name === document.getElementById('voiceSelect').value);
        if (sel) utt.voice = sel;
        utt.rate = 0.9;
        window.speechSynthesis.speak(utt);
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.lang = 'en-US';
        recognition.onresult = (e) => {
            document.getElementById('userInput').value += ' ' + e.results[0][0].transcript;
        };
    }

    function toggleMic() {
        unlockAudio();
        if (recognition) { try { recognition.start(); } catch(e){} }
        else { alert('Trình duyệt chưa hỗ trợ Micro.'); }
    }

    function startClass() {
        const name = document.getElementById('studentName').value.trim();
        if (!name) return alert('Em nhớ nhập tên nhé!');
        studentName = name;
        document.getElementById('displayStudentName').innerText = name;
        document.getElementById('startModal').style.display = 'none';
        unlockAudio();
        
        history.push({ role: 'student', text: `Hello, my name is ${studentName}. Let's learn ${document.getElementById('unitSelect').value} together!` });
        fetchTutorResponse();
    }

    function changeUnit() {
        const unit = document.getElementById('unitSelect').value;
        history.push({ role: 'student', text: `I want to study ${unit} now.` });
        fetchTutorResponse();
    }

    function setSkill(btnElement, skill) {
        document.querySelectorAll('.skill-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        currentSkill = skill;
        
        history.push({ role: 'student', text: `Let's switch to practicing: ${skill} for this unit.` });
        fetchTutorResponse();
    }

    document.getElementById('userInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAnswer(); }
    });

    function sendAnswer() {
        if (isProcessing) return;
        const text = document.getElementById('userInput').value.trim();
        if (!text) return;
        
        addStudentMessage(text);
        history.push({ role: 'student', text });
        document.getElementById('userInput').value = '';
        fetchTutorResponse();
    }

    function addStudentMessage(text) {
        const wrap = document.createElement('div');
        wrap.className = `msg-wrapper student-wrapper`;
        wrap.innerHTML = `<div class="msg student">${text}</div>`;
        document.getElementById('chatBox').appendChild(wrap);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    function addTutorMessage(englishObj, vietnameseObj) {
        const wrap = document.createElement('div');
        wrap.className = `msg-wrapper tutor-wrapper`;
        wrap.innerHTML = `
            <div class="msg tutor">
                <div class="en-text">${englishObj}</div>
                <div class="vn-text">${vietnameseObj}</div>
            </div>`;
        document.getElementById('chatBox').appendChild(wrap);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        
        // CHỈ cho phép đọc phần Tiếng Anh (chuẩn giọng US/UK)
        speakText(englishObj); 
    }

    async function fetchTutorResponse() {
        isProcessing = true;
        const btn = document.getElementById('sendBtn');
        btn.innerText = '...';
        
        try {
            const res = await fetch('/api/tutor', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    conversationHistory: history, 
                    studentName: studentName,
                    currentUnit: document.getElementById('unitSelect').value,
                    currentSkill: currentSkill
                })
            });
            const d = await res.json();
            if (d.english && d.vietnamese) {
                addTutorMessage(d.english, d.vietnamese);
                history.push({ role: 'tutor', english: d.english, vietnamese: d.vietnamese });
            }
        } catch (e) {
            addTutorMessage("I'm having a small connection issue. Could you repeat that?", "Thầy/Cô đang gặp chút vấn đề mạng. Em nói lại nhé! 😅");
        } finally {
            isProcessing = false;
            btn.innerText = 'Gửi';
        }
    }
</script>

</body>
</html>
